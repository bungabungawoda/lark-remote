name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run test --coverage

      - run: npx tsx scripts/verify-test-classification.ts

      - run: bun run build

      - run: bun run format:check

  # windows-latest 必做项。
  # describePosix 门控的用例在本 job 才真正跑（门控即盲区——ubuntu job 上
  # 它们全被 skip，win32 独有回归只能在这里暴露）。
  ci-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - run: npx tsx scripts/verify-test-classification.ts

      - run: bun run build

      # 冒烟：build 产物 --version / --help 可执行
      - run: node dist/cli.js --version
      - run: node dist/cli.js --help
